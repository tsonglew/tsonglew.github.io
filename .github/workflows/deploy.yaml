name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [master]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Pull requests build with read-only repository permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      # fonttools + brotli are required by scripts/subset-fonts.mjs, which runs
      # as part of `npm run build` to subset the CJK webfont to used glyphs.
      - name: Install fonttools for font subsetting
        run: pip3 install --break-system-packages fonttools brotli
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          node-version: 22 # Astro 6 requires Node 22+ (defaults to 20)

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
