name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [master]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      # fonttools + brotli are required by scripts/subset-fonts.mjs, which runs
      # as part of `npm run build` to subset the CJK webfont to used glyphs.
      - name: Install fonttools for font subsetting
        run: pip3 install --break-system-packages fonttools brotli
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          node-version: 22 # Astro 6 requires Node 22+ (defaults to 20)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
